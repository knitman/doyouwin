<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board – TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  color:#fff;
  font-family:Arial, sans-serif;
}
#root{
  display:grid;
  grid-template-columns:220px auto 260px;
  align-items:center;
  height:100vh;
  gap:24px;
  padding:24px;
}

/* LEFT */
#controls{
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
}
button{
  width:180px;
  padding:16px;
  font-size:22px;
  border:none;
  border-radius:18px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}
#qr img{
  background:#fff;
  padding:10px;
  border-radius:14px;
}

/* CENTER */
canvas{
  background:#2F6364;
  border-radius:16px;
}

/* RIGHT */
#scores{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.score{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#333;
  padding:10px 14px;
  border-radius:14px;
}
.score img{
  width:42px;
  height:42px;
  object-fit:contain;
}
.points{
  font-size:22px;
  font-weight:bold;
}

/* OVERLAY */
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:48px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
#overlay.show{ opacity:1; }
</style>
</head>

<body>

<div id="root">

  <!-- LEFT -->
  <div id="controls">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <div id="qr">
      <img id="qrImg" width="160">
    </div>
  </div>

  <!-- CENTER -->
  <canvas id="board" width="800" height="800"></canvas>

  <!-- RIGHT -->
  <div>
    <h2 style="text-align:center">🏆 Πόντοι</h2>
    <div id="scores"></div>
  </div>

</div>

<div id="overlay"></div>

<script>
/* ===== CANVAS ===== */
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const CELL=canvas.width/10;
const COLOR_A="#3A7F80", COLOR_B="#2F6364";

/* ===== STATE ===== */
let players={}, scores={}, visuals={}, images={};

/* LOAD AVATARS */
for(let i=1;i<=10;i++){
  const img=new Image();
  img.src=`/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`]=img;
}

/* DRAW */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const x=c*CELL,y=(9-r)*CELL;

    ctx.fillStyle=n%2?COLOR_A:COLOR_B;
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#ffffff44";
    ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font="bold 18px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);
  }

  Object.values(visuals).forEach(p=>{
    if(p.pos<=0) return;
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const cx=c*CELL+CELL/2, cy=(9-r)*CELL+CELL/2;
    const img=images[p.pawn];
    if(img?.complete){
      const s=CELL*0.65;
      ctx.drawImage(img,cx-s/2,cy-s/2,s,s);
    }
  });
}

/* SCORES */
function updateScores(){
  const box=document.getElementById("scores");
  box.innerHTML="";
  Object.keys(scores).forEach(id=>{
    const p=players[id];
    if(!p) return;
    const row=document.createElement("div");
    row.className="score";
    row.innerHTML=`
      <img src="${images[p.pawn].src}">
      <div class="points">${scores[id]}</div>
    `;
    box.appendChild(row);
  });
}

/* OVERLAY */
const overlay=document.getElementById("overlay");
function showOverlay(text,ms=3500){
  overlay.textContent=text;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),ms);
}

/* WS */
const ws=new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="INIT"||type==="UPDATE"){
    players=data.players;
    scores=data.scores||scores;

    Object.keys(players).forEach(id=>{
      visuals[id]??={ pawn:players[id].pawn, pos:players[id].pos };
      visuals[id].pos=players[id].pos;
    });

    updateScores();
    draw();
  }

  if(type==="ROUND_RESULT"){
    showOverlay("🏁 Τέλος γύρου!");
    scores=data.scores;
    updateScores();
  }

  if(type==="TOURNAMENT_WINNER"){
    showOverlay("🏆 ΤΕΛΙΚΟΣ ΝΙΚΗΤΗΣ!",6000);
  }
};

/* BUTTONS */
document.getElementById("startBtn").onclick=()=>{
  ws.send(JSON.stringify({type:"START"}));
};
document.getElementById("resetBtn").onclick=()=>{
  ws.send(JSON.stringify({type:"RESET"}));
};

document.getElementById("qrImg").src=
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
  encodeURIComponent(location.origin+"/phone");

draw();
</script>

</body>
</html>
