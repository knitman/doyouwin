<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>TV</title>
<style>
body{margin:0;background:#2F6364;color:#fff;font-family:Arial;text-align:center}
canvas{background:#2F6364;margin-top:20px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:bold;opacity:0;transition:.3s}
#overlay.show{opacity:1}
</style>
</head>
<body>

<button id="startBtn">START</button>
<button id="resetBtn">RESET</button>
<br>
<canvas id="board" width="800" height="800"></canvas>
<div id="overlay"></div>

<script>
const canvas=board,ctx=canvas.getContext("2d");
const CELL=80;
let players={},visuals={},images={};

for(let i=1;i<=10;i++){
  const img=new Image();
  img.src=`/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`]=img;
}

function draw(){
  ctx.clearRect(0,0,800,800);
  for(let i=0;i<100;i++){
    const x=(i%10)*CELL;
    const y=Math.floor(i/10)*CELL;
    ctx.strokeRect(x,y,CELL,CELL);
  }
  Object.values(visuals).forEach(p=>{
    if(p.pos<=0)return;
    const i=p.pos-1;
    const x=(i%10)*CELL+20;
    const y=Math.floor(i/10)*CELL+20;
    ctx.drawImage(images[p.pawn],x,y,40,40);
  });
}

function move(id,newPos){
  visuals[id].pos=newPos;
  draw();
}

const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="UPDATE"){
    players=data.players;
    Object.keys(players).forEach(id=>{
      visuals[id]??={pawn:players[id].pawn,pos:0};
      move(id,players[id].pos);
    });
  }

  if(type==="DICE"){
    overlay.innerText=`🎲 ${data.dice}`;
    overlay.classList.add("show");
    setTimeout(()=>overlay.classList.remove("show"),1000);
  }
};

startBtn.onclick=()=>ws.send(JSON.stringify({type:"START"}));
resetBtn.onclick=()=>ws.send(JSON.stringify({type:"RESET"}));

draw();
</script>
</body>
</html>
