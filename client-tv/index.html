<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}
#layout{
  display:grid;
  grid-template-columns:auto auto;
  gap:24px;
}
canvas{ background:#2F6364; }
#sideUI{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}
button{
  width:160px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}
#qr{
  background:white;
  padding:12px;
  border-radius:14px;
}

/* COMMAND OVERLAY */
#commandOverlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
}
#commandBox{
  background:#FFD166;
  color:#000;
  padding:42px 64px;
  border-radius:56px;
  font-size:38px;
  font-weight:bold;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<div id="layout">
  <canvas id="board" width="800" height="800"></canvas>
  <div id="sideUI">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <div id="qr"><img id="qrImg" width="160"></div>
  </div>
</div>

<div id="commandOverlay"><div id="commandBox"></div></div>

<script>
/* ===== CANVAS ===== */
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const CELL=canvas.width/10;
const COLOR_A="#3A7F80", COLOR_B="#2F6364";

/* ===== STATE ===== */
let players={}, visualPlayers={}, images={}, activityCells={};
let animating=false;

/* ===== LOAD AVATARS ===== */
for(let i=1;i<=10;i++){
  const img=new Image();
  img.src=`/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`]=img;
}

/* ===== ACTIVITIES ===== */
const ACTIVITIES={
  move2:[
    {text:"➡️ Πήγαινε 2 μπροστά",delta:2},
    {text:"⬅️ Πήγαινε 2 πίσω",delta:-2}
  ],
  move3:[
    {text:"➡️ Πήγαινε 3 μπροστά",delta:3},
    {text:"⬅️ Πήγαινε 3 πίσω",delta:-3}
  ],
  swap:[
    {text:"🔄 Αντάλλαξε θέση με άλλον παίκτη",swap:true}
  ]
};

function generateActivities(){
  activityCells={};
  while(Object.keys(activityCells).length<25){
    const n=Math.floor(Math.random()*98)+2;
    const k=Object.keys(ACTIVITIES);
    activityCells[n]=k[Math.floor(Math.random()*k.length)];
  }
}

/* ===== WS ===== */
const ws=new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);
  if(type==="INIT"||type==="UPDATE"){
    players=data.players;
    syncVisuals();
  }
};

/* ===== SYNC ===== */
function syncVisuals(){
  Object.values(players).forEach(p=>{
    if(p.pos===0) return;
    if(!visualPlayers[p.pawn]){
      visualPlayers[p.pawn]={pos:p.pos};
    }
    if(p.pos!==visualPlayers[p.pawn].pos){
      animatePawn(p.pawn,p.pos);
    }
  });
}

/* ===== ANIMATION CORE ===== */
function animatePawn(pawn,target){
  if(animating) return;
  animating=true;

  const v=visualPlayers[pawn];
  const dir=Math.sign(target-v.pos);

  const step=setInterval(()=>{
    if(v.pos===target){
      clearInterval(step);
      animating=false;
      handleLanding(pawn);
      return;
    }
    v.pos+=dir;
    draw();
  },180);
}

/* ===== LANDING ===== */
function handleLanding(pawn){
  const v=visualPlayers[pawn];
  const type=activityCells[v.pos];
  if(!type) return;

  const action=ACTIVITIES[type][
    Math.floor(Math.random()*ACTIVITIES[type].length)
  ];

  showCommand(action.text);

  setTimeout(()=>{
    if(action.delta){
      const target=Math.max(1,Math.min(100,v.pos+action.delta));
      animatePawn(pawn,target);
    }
    if(action.swap){
      const others=Object.entries(visualPlayers)
        .filter(([k])=>k!==pawn);
      if(others.length){
        const [_,t]=others[Math.floor(Math.random()*others.length)];
        [v.pos,t.pos]=[t.pos,v.pos];
        draw();
      }
    }
  },300);
}

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const x=c*CELL,y=(9-r)*CELL;

    ctx.fillStyle=(n%2)?COLOR_A:COLOR_B;
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#ffffff44";
    ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);
  }

  Object.entries(visualPlayers).forEach(([pawn,p])=>{
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const cx=c*CELL+CELL/2, cy=(9-r)*CELL+CELL/2;
    const img=images[pawn];
    if(img&&img.complete){
      const size=CELL*0.65;
      ctx.drawImage(img,cx-size/2,cy-size/2,size,size);
    }
  });
}

/* ===== COMMAND UI ===== */
const overlay=document.getElementById("commandOverlay");
const box=document.getElementById("commandBox");
function showCommand(t){
  box.textContent=t;
  overlay.style.opacity=1;
  setTimeout(()=>overlay.style.opacity=0,2500);
}

/* ===== UI ===== */
document.getElementById("startBtn").onclick=()=>{
  generateActivities();
  ws.send(JSON.stringify({type:"START"}));
};
document.getElementById("resetBtn").onclick=()=>{
  visualPlayers={};
  players={};
  generateActivities();
  ws.send(JSON.stringify({type:"RESET"}));
  draw();
};

document.getElementById("qrImg").src=
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
  encodeURIComponent(location.origin+"/phone");

generateActivities();
draw();
</script>

</body>
</html>
