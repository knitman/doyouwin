<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}

#layout{
  display:grid;
  grid-template-columns:auto auto;
  gap:24px;
}

canvas{ background:#2F6364; }

#sideUI{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}

button{
  width:160px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}

#qr{
  background:white;
  padding:12px;
  border-radius:14px;
}

/* OVERLAYS */
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .4s;
}

.box{
  background:#FFD166;
  color:#000;
  padding:40px 60px;
  border-radius:40px;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
}

.box h1{ margin:0 0 20px; font-size:42px; }

.order{
  display:flex;
  gap:20px;
  justify-content:center;
}

.order img{
  width:90px;
  height:90px;
  object-fit:contain;
}
</style>
</head>

<body>

<div id="layout">
  <canvas id="board" width="800" height="800"></canvas>

  <div id="sideUI">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <div id="qr"><img id="qrImg" width="160"></div>
  </div>
</div>

<!-- ORDER -->
<div id="orderOverlay" class="overlay">
  <div class="box">
    <h1>📜 Σειρά Παικτών</h1>
    <div class="order" id="orderList"></div>
  </div>
</div>

<!-- TURN -->
<div id="turnOverlay" class="overlay">
  <div class="box">
    <h1>🎯 Παίζει</h1>
    <img id="turnImg" width="140">
  </div>
</div>

<script>
/* ================= CANVAS ================= */
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const CELL=canvas.width/10;

/* ================= STATE ================= */
let players={},visualPlayers={},images={},activityCells={};
let currentTurn=null;

/* ================= LOAD AVATARS ================= */
for(let i=1;i<=10;i++){
  const img=new Image();
  img.src=`/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`]=img;
}

/* ================= ACTIVITIES ================= */
const ACTIVITIES={
  star:{symbol:"⭐",color:"#FFD166"},
  circle:{symbol:"●",color:"#06D6A0"},
  square:{symbol:"■",color:"#EF476F"}
};

function generateActivities(){
  activityCells={};
  while(Object.keys(activityCells).length<25){
    const n=Math.floor(Math.random()*98)+2;
    const k=Object.keys(ACTIVITIES);
    activityCells[n]=k[Math.floor(Math.random()*k.length)];
  }
}

/* ================= WS ================= */
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="ORDER"){
    showOrder(data.order);
  }

  if(type==="INIT"||type==="UPDATE"){
    players=data.players;
    if(data.turn && data.turn!==currentTurn){
      currentTurn=data.turn;
      showTurn(currentTurn);
    }
    syncVisuals();
  }
};

/* ================= VISUALS ================= */
function syncVisuals(){
  Object.values(players).forEach(p=>{
    if(p.pos===0) return; // ⬅️ εκτός ταμπλό
    if(!visualPlayers[p.pawn]){
      visualPlayers[p.pawn]={pos:p.pos};
    }
    visualPlayers[p.pawn].pos=p.pos;
  });
  draw();
}

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const x=c*CELL,y=(9-r)*CELL;

    ctx.fillStyle=activityCells[n]?ACTIVITIES[activityCells[n]].color:"#2F6364";
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#ffffff55"; ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);

    if(activityCells[n]){
      ctx.font="28px Arial";
      ctx.fillText(ACTIVITIES[activityCells[n]].symbol,x+CELL/2,y+CELL/2);
    }
  }

  Object.entries(visualPlayers).forEach(([pawn,p])=>{
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const cx=c*CELL+CELL/2, cy=(9-r)*CELL+CELL/2;

    const img=images[pawn];
    if(img && img.complete){
      const size=CELL*0.65;
      ctx.drawImage(img,cx-size/2,cy-size/2,size,size);
    }
  });
}

/* ================= OVERLAYS ================= */
function showOrder(order){
  const list=document.getElementById("orderList");
  list.innerHTML="";
  order.forEach(id=>{
    const p=players[id];
    if(!p) return;
    const img=document.createElement("img");
    img.src=images[p.pawn].src;
    list.appendChild(img);
  });
  const o=document.getElementById("orderOverlay");
  o.style.opacity=1;
  setTimeout(()=>o.style.opacity=0,3500);
}

function showTurn(id){
  const p=players[id];
  if(!p) return;
  const img=document.getElementById("turnImg");
  img.src=images[p.pawn].src;
  const o=document.getElementById("turnOverlay");
  o.style.opacity=1;
  setTimeout(()=>o.style.opacity=0,2000);
}

/* ================= UI ================= */
document.getElementById("startBtn").onclick=()=>{
  generateActivities();
  ws.send(JSON.stringify({type:"START"}));
};

document.getElementById("resetBtn").onclick=()=>{
  visualPlayers={};
  players={};
  generateActivities();
  ws.send(JSON.stringify({type:"RESET"}));
  draw();
};

document.getElementById("qrImg").src=
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
  encodeURIComponent(location.origin+"/phone");

/* ================= INIT ================= */
generateActivities();
draw();
</script>

</body>
</html>
