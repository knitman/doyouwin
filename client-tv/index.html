<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board – TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  color:#fff;
  font-family:Arial, sans-serif;
}

#root{
  display:grid;
  grid-template-columns:240px auto 300px;
  height:100vh;
}

/* RIGHT PANEL */
#participants{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.participant{
  display:flex;
  align-items:center;
  gap:10px;
  background:#2a2a2a;
  padding:8px;
  border-radius:10px;
}

.participant img{
  width:55px;
  height:55px;
}

.participant .score{
  margin-left:auto;
  font-size:22px;
  font-weight:bold;
  color:#FFD700;
}

#scores{
  margin-top:10px;
}
</style>
</head>

<body>

<div id="root">

  <!-- LEFT PANEL (ΔΕΝ ΠΕΙΡΑΧΤΗΚΕ) -->
  <div style="padding:10px">
    <h3>Ρυθμίσεις</h3>
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <img id="qrImg" width="160">
  </div>

  <!-- BOARD (ΔΕΝ ΠΕΙΡΑΧΤΗΚΕ) -->
  <canvas id="board" width="800" height="800"></canvas>

  <!-- RIGHT PANEL -->
  <div style="padding:10px">
    <h2 style="text-align:center">🎮 Παίκτες</h2>
    <div id="participants"></div>
  </div>

</div>

<script>
const ws = new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

let players = {};
let scores = {};

const participantsDiv = document.getElementById("participants");

/* ========= DRAW PARTICIPANTS ========= */
function drawParticipants(){
  participantsDiv.innerHTML="";

  Object.keys(players).forEach(id=>{
    const p = players[id];

    const d = document.createElement("div");
    d.className="participant";

    const img = document.createElement("img");
    img.src = `/assets/pawns/${p.pawn}.png`;

    const name = document.createElement("div");
    name.textContent = id.substring(0,4);

    const score = document.createElement("div");
    score.className="score";
    score.textContent = scores[id] ?? 0;

    d.appendChild(img);
    d.appendChild(name);
    d.appendChild(score);

    participantsDiv.appendChild(d);
  });
}

/* ========= WS ========= */
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="UPDATE"){
    players = data.players || {};
    scores = data.scores || {};
    drawParticipants();
  }
};

/* QR */
qrImg.src =
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
  encodeURIComponent(location.origin + "/phone");
</script>

</body>
</html>
