<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}

/* ===== LAYOUT ===== */
#layout{
  display:grid;
  grid-template-columns: 1fr auto;
  gap:24px;
  align-items:start;
}

/* ===== BOARD ===== */
#boardWrapper{
  display:flex;
  justify-content:center;
  align-items:center;
}

canvas{
  background:#2F6364;
}

/* ===== SIDE UI ===== */
#sideUI{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}

#qr{
  background:white;
  padding:12px;
  border-radius:14px;
}

button{
  width:160px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="layout">

  <div id="boardWrapper">
    <canvas id="board" width="800" height="800"></canvas>
  </div>

  <div id="sideUI">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>

    <div id="qr">
      <img id="qrImg" width="140">
    </div>
  </div>

</div>

<script>
/* ================= CANVAS ================= */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const SIZE = 10;
const CELL = canvas.width / SIZE;

/* ================= ACTIVITIES ================= */
const ACTIVITIES = {
  star:{color:"#FFD166",label:"⭐"},
  circle:{color:"#06D6A0",label:"●"},
  square:{color:"#EF476F",label:"■"}
};

const activityCells = {};
while(Object.keys(activityCells).length < 20){
  const n = Math.floor(Math.random()*98)+2;
  const k = Object.keys(ACTIVITIES);
  activityCells[n] = k[Math.floor(Math.random()*k.length)];
}

/* ================= STATE ================= */
let players = {};
let gameState = "WAITING";

/* ================= WEBSOCKET ================= */
const ws = new WebSocket(
 (location.protocol==="https:"?"wss://":"ws://")+location.host
);

ws.onmessage = e => {
 const {type,data} = JSON.parse(e.data);
 if(type==="INIT" || type==="UPDATE"){
   players=data.players;
   gameState=data.gameState;
   draw();
 }
};

/* ================= DRAW ================= */
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 for(let i=0;i<100;i++){
   const num=i+1;
   const row=Math.floor(i/10);
   const col=row%2===0?i%10:9-(i%10);
   const x=col*CELL;
   const y=(9-row)*CELL;

   ctx.fillStyle=activityCells[num]
     ?ACTIVITIES[activityCells[num]].color
     :"#2F6364";
   ctx.fillRect(x,y,CELL,CELL);

   ctx.strokeStyle="#ffffff55";
   ctx.strokeRect(x,y,CELL,CELL);

   ctx.fillStyle="#000";
   ctx.font="bold 16px Arial";
   ctx.textAlign="left";
   ctx.textBaseline="top";
   ctx.fillText(num,x+6,y+4);

   if(activityCells[num]){
     ctx.font="28px Arial";
     ctx.textAlign="center";
     ctx.textBaseline="middle";
     ctx.fillText(
       ACTIVITIES[activityCells[num]].label,
       x+CELL/2,
       y+CELL/2
     );
   }
 }

 Object.values(players).forEach(p=>{
   const pos=p.pos||1;
   const i=pos-1;
   const row=Math.floor(i/10);
   const col=row%2===0?i%10:9-(i%10);
   const cx=col*CELL+CELL/2;
   const cy=(9-row)*CELL+CELL/2;

   ctx.beginPath();
   ctx.fillStyle="#FFD166";
   ctx.arc(cx,cy,CELL*0.28,0,Math.PI*2);
   ctx.fill();

   ctx.fillStyle="#000";
   ctx.font="bold 18px Arial";
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   const label=p.pawn?"A"+p.pawn.split("_")[1]:"?";
   ctx.fillText(label,cx,cy);
 });
}

/* ================= UI ================= */
document.getElementById("startBtn").onclick=()=>{
 ws.send(JSON.stringify({type:"START"}));
};

document.getElementById("resetBtn").onclick=()=>{
 location.reload();
};

/* ================= QR ================= */
const qrImg=document.getElementById("qrImg");
qrImg.src=
 "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
 encodeURIComponent(location.origin+"/phone");

draw();
</script>

</body>
</html>
