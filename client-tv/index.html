<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}
#layout{
  display:grid;
  grid-template-columns:auto auto;
  gap:24px;
}
canvas{ background:#2F6364; }
#sideUI{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}
button{
  width:160px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}
#qr{
  background:white;
  padding:12px;
  border-radius:14px;
}

/* ===== COMMAND OVERLAY (ANIMATED) ===== */
#commandOverlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
}
#commandBox{
  background:#FFD166;
  color:#000;
  padding:42px 64px;
  border-radius:56px;
  font-size:40px;
  font-weight:bold;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
  transform:scale(.7);
  animation:none;
}
@keyframes popIn{
  0%{ transform:scale(.6); }
  60%{ transform:scale(1.08); }
  100%{ transform:scale(1); }
}

/* ===== HIGHLIGHT ===== */
.glow{
  filter: drop-shadow(0 0 10px rgba(255,214,102,.9))
          drop-shadow(0 0 18px rgba(255,214,102,.7));
}
</style>
</head>

<body>

<div id="layout">
  <canvas id="board" width="800" height="800"></canvas>
  <div id="sideUI">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <div id="qr"><img id="qrImg" width="160"></div>
  </div>
</div>

<div id="commandOverlay">
  <div id="commandBox"></div>
</div>

<script>
/* ================= CANVAS ================= */
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const CELL=canvas.width/10;

/* ================= COLORS ================= */
const COLOR_A="#3A7F80";
const COLOR_B="#2F6364";

/* ================= AUDIO ================= */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function commandSound(){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="triangle";
  o.frequency.setValueAtTime(520,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(760,audioCtx.currentTime+.25);
  g.gain.value=.12;
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+.25);
}

/* ================= STATE ================= */
let players={}, visualPlayers={}, images={}, activityCells={};
let highlightedPawn=null;
let highlightUntil=0;

/* ================= LOAD AVATARS ================= */
for(let i=1;i<=10;i++){
  const img=new Image();
  img.src=`/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`]=img;
}

/* ================= ACTIVITIES ================= */
const ACTIVITIES={
  move2:[
    {text:"➡️ Πήγαινε 2 μπροστά",move:2},
    {text:"⬅️ Πήγαινε 2 πίσω",move:-2}
  ],
  move3:[
    {text:"➡️ Πήγαινε 3 μπροστά",move:3},
    {text:"⬅️ Πήγαινε 3 πίσω",move:-3}
  ],
  swap:[
    {text:"🔄 Αντάλλαξε θέση με άλλον παίκτη",swap:true}
  ]
};

function generateActivities(){
  activityCells={};
  while(Object.keys(activityCells).length<25){
    const n=Math.floor(Math.random()*98)+2;
    const k=Object.keys(ACTIVITIES);
    activityCells[n]=k[Math.floor(Math.random()*k.length)];
  }
}

/* ================= WS ================= */
const ws=new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);
  if(type==="INIT"||type==="UPDATE"){
    players=data.players;
    syncVisuals();
  }
};

/* ================= SYNC ================= */
function syncVisuals(){
  Object.values(players).forEach(p=>{
    if(p.pos===0) return;
    if(!visualPlayers[p.pawn]){
      visualPlayers[p.pawn]={pos:p.pos,lastPos:null};
    }
    const v=visualPlayers[p.pawn];
    if(v.pos!==p.pos){
      v.lastPos=v.pos;
      v.pos=p.pos;
      handleLanding(p.pawn,v);
    }
  });
  draw();
}

/* ================= LANDING LOGIC ================= */
function handleLanding(pawn,v){
  const type=activityCells[v.pos];
  if(!type) return;

  const action=ACTIVITIES[type][
    Math.floor(Math.random()*ACTIVITIES[type].length)
  ];

  showCommand(action.text);
  commandSound();
  highlightPawn(pawn,1200);

  if(action.move){
    v.pos=Math.max(1,Math.min(100,v.pos+action.move));
  }
  if(action.swap){
    const others=Object.entries(visualPlayers)
      .filter(([k,_])=>k!==pawn)
      .map(([_,o])=>o);
    if(others.length){
      const t=others[Math.floor(Math.random()*others.length)];
      [v.pos,t.pos]=[t.pos,v.pos];
    }
  }
}

/* ================= HIGHLIGHT ================= */
function highlightPawn(pawn,ms){
  highlightedPawn=pawn;
  highlightUntil=Date.now()+ms;
}

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // board
  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const x=c*CELL,y=(9-r)*CELL;

    ctx.fillStyle=(n%2)?COLOR_A:COLOR_B;
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#ffffff44";
    ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);
  }

  // pawns
  Object.entries(visualPlayers).forEach(([pawn,p])=>{
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const cx=c*CELL+CELL/2, cy=(9-r)*CELL+CELL/2;

    const img=images[pawn];
    if(img && img.complete){
      const size=CELL*0.65;

      // glow highlight
      if(pawn===highlightedPawn && Date.now()<highlightUntil){
        ctx.save();
        ctx.shadowColor="rgba(255,214,102,.9)";
        ctx.shadowBlur=18;
        ctx.drawImage(img,cx-size/2,cy-size/2,size,size);
        ctx.restore();
      }else{
        ctx.drawImage(img,cx-size/2,cy-size/2,size,size);
      }
    }
  });

  requestAnimationFrame(draw);
}

/* ================= COMMAND UI ================= */
const overlay=document.getElementById("commandOverlay");
const box=document.getElementById("commandBox");
function showCommand(t){
  box.textContent=t;
  box.style.animation="none";
  void box.offsetWidth; // restart animation
  box.style.animation="popIn .35s ease-out forwards";
  overlay.style.opacity=1;
  setTimeout(()=>overlay.style.opacity=0,2500);
}

/* ================= UI ================= */
document.getElementById("startBtn").onclick=()=>{
  generateActivities();
  ws.send(JSON.stringify({type:"START"}));
};
document.getElementById("resetBtn").onclick=()=>{
  visualPlayers={};
  players={};
  highlightedPawn=null;
  generateActivities();
  ws.send(JSON.stringify({type:"RESET"}));
};

document.getElementById("qrImg").src=
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
  encodeURIComponent(location.origin+"/phone");

/* ================= INIT ================= */
generateActivities();
draw();
</script>

</body>
</html>
