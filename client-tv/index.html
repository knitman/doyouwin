<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}

#layout{
  display:grid;
  grid-template-columns:auto auto;
  gap:24px;
}

canvas{ background:#2F6364; }

#sideUI{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}

button{
  width:160px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}

#qr{
  background:white;
  padding:12px;
  border-radius:14px;
}

/* MESSAGE */
#message, #winner{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .4s;
}

#messageBox{
  background:#FFD166;
  color:#000;
  padding:36px 56px;
  font-size:32px;
  font-weight:bold;
  border-radius:36px;
}

#winnerBox{
  background:#FFD166;
  padding:50px 70px;
  border-radius:40px;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
}

#winnerBox h1{
  margin:0 0 20px;
  font-size:48px;
}

#winnerBox img{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  border:6px solid #000;
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div id="layout">
  <canvas id="board" width="800" height="800"></canvas>

  <div id="sideUI">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <div id="qr"><img id="qrImg" width="160"></div>
  </div>
</div>

<div id="message"><div id="messageBox"></div></div>

<div id="winner">
  <div id="winnerBox">
    <h1>🏆 ΝΙΚΗΤΗΣ!</h1>
    <img id="winnerImg">
  </div>
</div>

<script>
/* ================= CANVAS ================= */
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const CELL=canvas.width/10;

/* ================= AUDIO ================= */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();

function stepSound(){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="square"; o.frequency.value=220; g.gain.value=0.05;
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.05);
}

function winSound(){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="triangle";
  o.frequency.setValueAtTime(440,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(880,audioCtx.currentTime+0.6);
  g.gain.value=0.1;
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.6);
}

/* ================= ACTIVITIES ================= */
const ACTIVITIES={
  star:{symbol:"⭐",color:"#FFD166",actions:[{t:"Πήγαινε 2 μπροστά",m:2},{t:"Πήγαινε 3 μπροστά",m:3}]},
  circle:{symbol:"●",color:"#06D6A0",actions:[{t:"Πήγαινε 2 πίσω",m:-2},{t:"Πήγαινε 3 πίσω",m:-3}]},
  square:{symbol:"■",color:"#EF476F",actions:[{t:"Αντάλλαξε θέση με τον 3ο παίκτη",s:2}]}
};

/* ================= STATE ================= */
let players={},visualPlayers={},images={},activityCells={},activeIntervals=[];
let gameEnded=false;

/* ================= LOAD AVATARS ================= */
for(let i=1;i<=10;i++){
  const img=new Image();
  img.src=`/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`]=img;
}

/* ================= ACTIVITIES GEN ================= */
function generateActivities(){
  activityCells={};
  while(Object.keys(activityCells).length<25){
    const n=Math.floor(Math.random()*98)+2;
    const k=Object.keys(ACTIVITIES);
    activityCells[n]=k[Math.floor(Math.random()*k.length)];
  }
}

/* ================= WS ================= */
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);
  if(type==="INIT"||type==="UPDATE"){
    players=data.players;
    syncVisuals();
  }
};

/* ================= SYNC ================= */
function syncVisuals(){
  if(gameEnded) return;

  Object.values(players).forEach(p=>{
    if(p.pos>=100 && !gameEnded){
      showWinner(p.pawn);
      return;
    }
    if(!visualPlayers[p.pawn]){
      visualPlayers[p.pawn]={pos:p.pos};
    }
    if(p.pos!==visualPlayers[p.pawn].pos){
      animateMove(p.pawn,p.pos);
    }
  });
  draw();
}

/* ================= ANIMATE ================= */
function animateMove(pawn,target){
  clearIntervals();
  const v=visualPlayers[pawn];
  const dir=Math.sign(target-v.pos);

  const int=setInterval(()=>{
    if(v.pos===target){
      clearInterval(int);
      applyActivity(pawn);
      return;
    }
    v.pos+=dir;
    stepSound();
    draw();
  },180);

  activeIntervals.push(int);
}

/* ================= ACTIVITY ================= */
function applyActivity(pawn){
  if(gameEnded) return;
  const v=visualPlayers[pawn];
  const type=activityCells[v.pos];
  if(!type) return;

  const act=ACTIVITIES[type];
  const a=act.actions[Math.floor(Math.random()*act.actions.length)];
  showMessage(a.t);

  if(a.m) v.pos=Math.max(1,Math.min(100,v.pos+a.m));
  if(a.s!==undefined){
    const list=Object.values(visualPlayers);
    if(list[a.s]){
      const tmp=v.pos;
      v.pos=list[a.s].pos;
      list[a.s].pos=tmp;
    }
  }
  draw();
}

/* ================= WINNER ================= */
function showWinner(pawn){
  gameEnded=true;
  clearIntervals();
  winSound();
  launchConfetti();

  document.getElementById("winnerImg").src=images[pawn].src;
  document.getElementById("winner").style.opacity=1;
}

/* ================= CONFETTI ================= */
function launchConfetti(){
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    c.style.animationDuration=2+Math.random()*2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

/* ================= CLEANUP ================= */
function clearIntervals(){
  activeIntervals.forEach(i=>clearInterval(i));
  activeIntervals=[];
}

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const x=c*CELL,y=(9-r)*CELL;

    ctx.fillStyle=activityCells[n]?ACTIVITIES[activityCells[n]].color:"#2F6364";
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#ffffff55"; ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);

    if(activityCells[n]){
      ctx.font="28px Arial";
      ctx.fillText(ACTIVITIES[activityCells[n]].symbol,x+CELL/2,y+CELL/2);
    }
  }

  Object.entries(visualPlayers).forEach(([pawn,p])=>{
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const cx=c*CELL+CELL/2,cy=(9-r)*CELL+CELL/2;

    const img=images[pawn];
    if(img && img.complete){
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx,cy,CELL*0.3,0,Math.PI*2);
      ctx.clip();
      ctx.drawImage(img,cx-CELL*0.3,cy-CELL*0.3,CELL*0.6,CELL*0.6);
      ctx.restore();
    }
  });
}

/* ================= MESSAGE ================= */
const msg=document.getElementById("message"),box=document.getElementById("messageBox");
function showMessage(t){
  box.textContent=t;
  msg.style.opacity=1;
  setTimeout(()=>msg.style.opacity=0,2500);
}

/* ================= UI ================= */
document.getElementById("startBtn").onclick=()=>{
  gameEnded=false;
  document.getElementById("winner").style.opacity=0;
  generateActivities();
  ws.send(JSON.stringify({type:"START"}));
};

document.getElementById("resetBtn").onclick=()=>{
  gameEnded=false;
  clearIntervals();
  visualPlayers={};
  players={};
  generateActivities();
  document.getElementById("winner").style.opacity=0;
  ws.send(JSON.stringify({type:"RESET"}));
  draw();
};

document.getElementById("qrImg").src=
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
  encodeURIComponent(location.origin+"/phone");

/* ================= INIT ================= */
generateActivities();
draw();
</script>

</body>
</html>
