<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board – TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  color:#fff;
  font-family:Arial, sans-serif;
}
#root{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  gap:24px;
}
canvas{ background:#2F6364; }

#sidebar{
  width:260px;
}
#sidebar h2{
  text-align:center;
  margin-bottom:10px;
}
.score{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#333;
  padding:8px 12px;
  border-radius:10px;
  margin-bottom:8px;
}
.score img{
  width:40px;
  height:40px;
  object-fit:contain;
}
.points{
  font-size:22px;
  font-weight:bold;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.6);
  font-size:46px;
  font-weight:bold;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.overlay.show{ opacity:1; }

#qr{
  margin-top:20px;
  text-align:center;
}
#qr img{ background:#fff; padding:10px; border-radius:12px; }
</style>
</head>

<body>

<div id="root">
  <canvas id="board" width="800" height="800"></canvas>

  <div id="sidebar">
    <h2>🏆 Πόντοι</h2>
    <div id="scores"></div>

    <div id="qr">
      <img id="qrImg" width="180">
      <div>Scan & Play</div>
    </div>
  </div>
</div>

<div id="overlay" class="overlay"></div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const CELL=canvas.width/10;
const COLOR_A="#3A7F80", COLOR_B="#2F6364";

let players={}, scores={}, visuals={}, images={};

/* LOAD AVATARS */
for(let i=1;i<=10;i++){
  const img=new Image();
  img.src=`/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`]=img;
}

/* DRAW BOARD */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-i%10;
    const x=c*CELL,y=(9-r)*CELL;

    ctx.fillStyle=n%2?COLOR_A:COLOR_B;
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#ffffff44";
    ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.font="bold 18px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);
  }

  Object.values(visuals).forEach(p=>{
    if(p.pos<=0) return;
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-i%10;
    const cx=c*CELL+CELL/2, cy=(9-r)*CELL+CELL/2;
    const img=images[p.pawn];
    if(img?.complete){
      const s=CELL*0.65;
      ctx.drawImage(img,cx-s/2,cy-s/2,s,s);
    }
  });
}

/* SCOREBOARD */
function updateScores(){
  const box=document.getElementById("scores");
  box.innerHTML="";
  Object.keys(scores).forEach(id=>{
    const p=players[id];
    if(!p) return;
    const row=document.createElement("div");
    row.className="score";
    row.innerHTML=`
      <img src="${images[p.pawn].src}">
      <div class="points">${scores[id]}</div>
    `;
    box.appendChild(row);
  });
}

/* OVERLAY */
const overlay=document.getElementById("overlay");
function showOverlay(text,ms=3000){
  overlay.textContent=text;
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"),ms);
}

/* WS */
const ws=new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="INIT"||type==="UPDATE"){
    players=data.players;
    scores=data.scores||scores;
    Object.keys(players).forEach(id=>{
      visuals[id]??={ pawn:players[id].pawn, pos:players[id].pos };
      visuals[id].pos=players[id].pos;
    });
    updateScores();
    draw();
  }

  if(type==="ROUND_RESULT"){
    const winner=data.order[0];
    showOverlay("🏁 Νικητής γύρου!",3000);
    scores=data.scores;
    updateScores();
  }

  if(type==="TOURNAMENT_WINNER"){
    const winId=data.id;
    showOverlay("🏆 ΤΕΛΙΚΟΣ ΝΙΚΗΤΗΣ!",6000);
  }
};

document.getElementById("qrImg").src=
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
  encodeURIComponent(location.origin+"/phone");

draw();
</script>

</body>
</html>
