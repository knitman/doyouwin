<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>ΜΠΟΡΕΙΣ ΝΑ ΚΕΡΔΙΣΕΙΣ</title>
<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}
canvas{
  background:#0b1d3a;
  border-radius:22px;
}
#rollBtn{
  position:fixed;
  bottom:40px;
  right:40px;
  font-size:26px;
  padding:16px 30px;
  border:none;
  border-radius:18px;
  background:#ffbe0b;
  font-weight:bold;
  cursor:pointer;
  z-index:5;
}
#rollBtn:disabled{opacity:0.4;}

.overlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:10;
}
.overlay.show{opacity:1;}
.box{
  background:linear-gradient(135deg,#ff006e,#8338ec);
  padding:50px 90px;
  border-radius:50px;
  font-size:46px;
  font-weight:bold;
  box-shadow:0 0 60px rgba(255,0,110,.8);
}

#qr{
  position:fixed;
  left:30px;
  bottom:30px;
  text-align:center;
  font-size:14px;
  opacity:0.85;
}
#qr img{
  width:140px;
  height:140px;
  border-radius:16px;
  background:white;
  padding:6px;
}
</style>
</head>
<body>

<canvas id="board" width="720" height="720"></canvas>
<button id="rollBtn">🎲 ROLL</button>

<div id="qr">
  <div>Scan &amp; Pick Emoji</div>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://localhost:5500/client-phone/index.html">
</div>

<div id="eventOverlay" class="overlay">
  <div id="eventBox" class="box"></div>
</div>
<div id="turnOverlay" class="overlay">
  <div id="turnBox" class="box"></div>
</div>

<script>
/* ================= AUDIO ================= */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d,v,t){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=t; o.frequency.value=f; g.gain.value=v;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+d);
}
const sndDice=()=>tone(380,0.15,0.08,"square");
const sndStep=()=>tone(240,0.07,0.09,"square"); // ξύλινο
const sndEvent=()=>tone(180,0.35,0.10,"sawtooth");

/* ================= CANVAS ================= */
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const SIZE=10;
const CELL=canvas.width/SIZE;
const STEP_DELAY=420;

/* ================= BOARD ================= */
const board=[];
let n=1;
for(let r=0;r<SIZE;r++){
  const cols=[...Array(SIZE).keys()];
  if(r%2===1) cols.reverse();
  for(const c of cols){board.push({number:n,row:r,col:c});n++;}
}
const getCell=num=>board.find(c=>c.number===num);
const center=c=>({x:c.col*CELL+CELL/2,y:(SIZE-1-c.row)*CELL+CELL/2});

/* ================= EVENTS ================= */
const events={
  4:{shape:"square",action:"RANDOM"},
  6:{shape:"circle",action:"FORWARD_2"},
  8:{shape:"triangle",action:"BACK_2"},
  11:{shape:"square",action:"TELEPORT"},
  14:{shape:"circle",action:"BONUS"},
  16:{shape:"triangle",action:"SKIP"},
  19:{shape:"square",action:"RANDOM"},
  22:{shape:"circle",action:"FORWARD_3"},
  24:{shape:"triangle",action:"BACK_3"},
  27:{shape:"square",action:"TELEPORT"},
  30:{shape:"circle",action:"BONUS"},
  33:{shape:"square",action:"RANDOM"},
  36:{shape:"triangle",action:"BACK_5"},
  39:{shape:"circle",action:"FORWARD_2"},
  42:{shape:"square",action:"TELEPORT"},
  45:{shape:"triangle",action:"SKIP"},
  48:{shape:"circle",action:"FORWARD_3"},
  51:{shape:"square",action:"RANDOM"},
  54:{shape:"triangle",action:"BACK_3"},
  57:{shape:"circle",action:"BONUS"},
  60:{shape:"square",action:"TELEPORT"},
  63:{shape:"triangle",action:"BACK_2"},
  66:{shape:"square",action:"RANDOM"},
  69:{shape:"circle",action:"FORWARD_2"},
  72:{shape:"triangle",action:"SKIP"},
  75:{shape:"square",action:"TELEPORT"},
  78:{shape:"circle",action:"FORWARD_3"},
  81:{shape:"square",action:"RANDOM"},
  84:{shape:"triangle",action:"BACK_5"},
  87:{shape:"circle",action:"BONUS"},
  90:{shape:"square",action:"TELEPORT"},
  93:{shape:"triangle",action:"BACK_3"},
  96:{shape:"square",action:"RANDOM"}
};

/* ================= PLAYERS FROM SERVER ================= */
let players=[];

/* ================= WEBSOCKET ================= */
const ws=new WebSocket("ws://localhost:8080");
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);
  if(type==="UPDATE"){
    players=Object.values(data).map(p=>({
      emoji:p.emoji,
      pos:1,
      skip:false
    }));
    render();
  }
};

/* ================= DRAW ================= */
function drawBoard(){
  board.forEach(c=>{
    const x=c.col*CELL,y=(SIZE-1-c.row)*CELL;
    ctx.fillStyle=(c.number%2===0)?"#1e90ff":"#00b4d8";
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#03045e";
    ctx.strokeRect(x,y,CELL,CELL);
    ctx.fillStyle="#fff";
    ctx.font=`bold ${CELL*0.4}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(c.number,x+CELL/2,y+CELL/2);
  });
}

function drawEvents(){
  Object.entries(events).forEach(([num,e])=>{
    const c=getCell(+num);
    const cx=c.col*CELL+CELL/2;
    const cy=(SIZE-1-c.row)*CELL+CELL/2;
    const s=CELL*0.25;
    ctx.save();ctx.translate(cx,cy);
    if(e.shape==="circle"){ctx.fillStyle="#2ecc71";ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();}
    if(e.shape==="triangle"){ctx.fillStyle="#e74c3c";ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s,s);ctx.lineTo(-s,s);ctx.fill();}
    if(e.shape==="square"){ctx.fillStyle="#9b59b6";ctx.fillRect(-s,-s,s*2,s*2);}
    ctx.restore();
  });
}

function drawPlayers(){
  const grouped={};
  players.forEach(p=>{
    if(!grouped[p.pos]) grouped[p.pos]=[];
    grouped[p.pos].push(p);
  });
  Object.entries(grouped).forEach(([pos,list])=>{
    const c=center(getCell(+pos));
    list.forEach((p,i)=>{
      const a=(i/list.length)*Math.PI*2;
      ctx.font="36px serif";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(
        p.emoji,
        c.x+Math.cos(a)*CELL*0.22,
        c.y+Math.sin(a)*CELL*0.22
      );
    });
  });
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBoard();
  drawEvents();
  drawPlayers();
}

render();
</script>
</body>
</html>
