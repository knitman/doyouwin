<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>
<style>
body{
 margin:0;background:#050505;color:white;font-family:Arial;
 height:100vh;display:flex;justify-content:center;align-items:center;
}
canvas{background:#0b1d3a;border-radius:22px;}
#diceOverlay{
 position:fixed;inset:0;display:flex;justify-content:center;
 align-items:center;font-size:120px;font-weight:bold;
 opacity:0;pointer-events:none;
}
#diceOverlay.show{opacity:1;}
</style>
</head>
<body>

<canvas id="board" width="720" height="720"></canvas>
<div id="diceOverlay"></div>

<script>
const ws=new WebSocket(
 (location.protocol==="https:"?"wss://":"ws://")+location.host
);

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const diceOverlay=document.getElementById("diceOverlay");

const SIZE=10,CELL=canvas.width/SIZE;
const board=[];
let n=1;
for(let r=0;r<SIZE;r++){
 const cols=[...Array(SIZE).keys()];
 if(r%2) cols.reverse();
 for(const c of cols){board.push({number:n,row:r,col:c});n++;}
}
const getCell=num=>board.find(c=>c.number===num);
const center=c=>({x:c.col*CELL+CELL/2,y:(SIZE-1-c.row)*CELL+CELL/2});

let players={},currentTurn=null;

ws.onmessage=e=>{
 const {type,data}=JSON.parse(e.data);

 if(type==="UPDATE"){
  players=data.players;
  currentTurn=data.turn;
  render();
 }

 if(type==="DICE"){
  diceOverlay.textContent="🎲 "+data.dice;
  diceOverlay.classList.add("show");
  setTimeout(()=>diceOverlay.classList.remove("show"),1500);
  movePlayer(data.id,data.dice);
 }
};

function drawBoard(){
 board.forEach(c=>{
  const x=c.col*CELL,y=(SIZE-1-c.row)*CELL;
  ctx.fillStyle=c.number%2?"#00b4d8":"#1e90ff";
  ctx.fillRect(x,y,CELL,CELL);
  ctx.strokeRect(x,y,CELL,CELL);
  ctx.fillStyle="#fff";
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(c.number,x+CELL/2,y+CELL/2);
 });
}

function drawPlayers(){
 let dockX=40;
 Object.values(players).forEach(p=>{
  let pos;
  if(!p.started){
    pos={x:dockX,y:canvas.height+40};
    dockX+=50;
  }else{
    pos=center(getCell(p.pos));
  }
  ctx.font="36px serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(p.emoji,pos.x,pos.y);
 });
}

function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 drawBoard();
 drawPlayers();
}

function movePlayer(id,steps){
 const p=players[id];
 function step(){
  if(steps===0){
    ws.send(JSON.stringify({type:"MOVE_DONE",data:{id,pos:p.pos}}));
    return;
  }
  if(!p.started) p.started=true;
  p.pos++;
  render();
  steps--;
  setTimeout(step,350);
 }
 step();
}

render();
</script>
</body>
</html>
