<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board – TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  color:#fff;
  font-family:Arial, sans-serif;
}

#root{
  display:grid;
  grid-template-columns:240px auto 280px;
  height:100vh;
}

/* RIGHT PANEL */
#rightPanel{
  padding:10px;
  border-left:3px solid #333;
  display:flex;
  flex-direction:column;
}

#participants{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
}

.participant{
  width:70px;
  height:70px;
  border-radius:10px;
  background:#2a2a2a;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
}

.participant img{
  width:100%;
}

/* SCORE */
#scores{
  margin-top:10px;
}
</style>
</head>

<body>

<div id="root">

  <!-- LEFT -->
  <div style="padding:10px">
    <h3>Ρυθμίσεις</h3>
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <img id="qrImg" width="160">
  </div>

  <!-- BOARD -->
  <canvas id="board" width="800" height="800"></canvas>

  <!-- RIGHT -->
  <div id="rightPanel">
    <h2 style="text-align:center">🏆 Πόντοι</h2>
    <div id="scores"></div>

    <h2 style="text-align:center;margin-top:30px;">🎮 Παίκτες</h2>
    <div id="participants"></div>
  </div>

</div>

<script>
const ws = new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

let players = {};
let scores = {};

const participantsDiv = document.getElementById("participants");

/* ============ DRAW PARTICIPANTS ============ */
function drawParticipants(){
  participantsDiv.innerHTML="";

  Object.keys(players).forEach(id=>{
    const p = players[id];

    const d = document.createElement("div");
    d.className="participant";

    const img = document.createElement("img");
    img.src = `/assets/pawns/${p.pawn}.png`;

    d.appendChild(img);
    participantsDiv.appendChild(d);
  });
}

/* ============ WS ============ */
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="UPDATE"){
    players = data.players || {};
    scores = data.scores || {};

    drawParticipants();
  }
};

/* QR */
qrImg.src =
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
  encodeURIComponent(location.origin + "/phone");
</script>

</body>
</html>
