<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>
<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
canvas{
  background:#0b1d3a;
  border-radius:22px;
}
#qr{
  position:fixed;
  left:30px;
  bottom:30px;
  text-align:center;
}
#qr img{
  width:140px;
  border-radius:14px;
  background:white;
  padding:6px;
}
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  opacity:0;
  transition:.25s;
}
.overlay.show{opacity:1;}
.box{
  background:linear-gradient(135deg,#ff006e,#8338ec);
  padding:50px 90px;
  border-radius:50px;
  font-size:46px;
  font-weight:bold;
}
</style>
</head>
<body>

<canvas id="board" width="720" height="720"></canvas>

<div id="qr">
  <div>Scan & Join</div>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://localhost:5500/client-phone/index.html">
</div>

<div id="overlay" class="overlay">
  <div id="overlayBox" class="box"></div>
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const overlayBox=document.getElementById("overlayBox");

const SIZE=10;
const CELL=canvas.width/SIZE;
const STEP_DELAY=420;

const ws=new WebSocket("ws://localhost:8080");

let players={};
let currentTurn=null;

const board=[];
let n=1;
for(let r=0;r<SIZE;r++){
  const cols=[...Array(SIZE).keys()];
  if(r%2) cols.reverse();
  for(const c of cols){ board.push({number:n,row:r,col:c}); n++; }
}
const getCell=num=>board.find(c=>c.number===num);
const center=c=>({x:c.col*CELL+CELL/2,y:(SIZE-1-c.row)*CELL+CELL/2});

ws.onmessage=e=>{
  const { type, data } = JSON.parse(e.data);

  if(type==="UPDATE"){
    players=data.players;
    currentTurn=data.turn;
    render();
  }

  if(type==="DICE"){
    movePlayer(data.id,data.dice);
  }

  if(type==="WIN"){
    overlayBox.textContent="🏆 ΝΙΚΗΤΗΣ " + data.emoji;
    overlay.classList.add("show");
  }
};

function drawBoard(){
  board.forEach(c=>{
    const x=c.col*CELL,y=(SIZE-1-c.row)*CELL;
    ctx.fillStyle=c.number%2?"#00b4d8":"#1e90ff";
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#03045e";
    ctx.strokeRect(x,y,CELL,CELL);
    ctx.fillStyle="#fff";
    ctx.font=`bold ${CELL*0.4}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(c.number,x+CELL/2,y+CELL/2);
  });
}

function drawPlayers(){
  Object.values(players).forEach(p=>{
    const c=center(getCell(p.pos));
    ctx.font="36px serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(p.emoji,c.x,c.y);
  });
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBoard();
  drawPlayers();
}

function movePlayer(id,steps){
  const p=players[id];
  function step(){
    if(steps===0){
      ws.send(JSON.stringify({ type:"MOVE_DONE", data:{ id, pos:p.pos }}));
      return;
    }
    p.pos++;
    steps--;
    render();
    setTimeout(step,STEP_DELAY);
  }
  step();
}

render();
</script>
</body>
</html>
