<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}

#layout{
  display:grid;
  grid-template-columns:auto auto;
  gap:24px;
}

canvas{ background:#2F6364; }

#sideUI{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}

button{
  width:160px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}

#qr{
  background:white;
  padding:12px;
  border-radius:14px;
}

/* ===== CENTER COMMAND ===== */
#commandOverlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
}

#commandBox{
  background:#FFD166;
  color:#000;
  padding:40px 60px;
  border-radius:50px;
  font-size:38px;
  font-weight:bold;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<div id="layout">
  <canvas id="board" width="800" height="800"></canvas>

  <div id="sideUI">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>
    <div id="qr"><img id="qrImg" width="160"></div>
  </div>
</div>

<div id="commandOverlay">
  <div id="commandBox"></div>
</div>

<script>
/* ================= CANVAS ================= */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const CELL = canvas.width / 10;

/* ================= COLORS ================= */
const COLOR_A = "#3A7F80";
const COLOR_B = "#2F6364";

/* ================= STATE ================= */
let players = {};
let visualPlayers = {};
let images = {};
let activityCells = {};

/* ================= LOAD AVATARS ================= */
for(let i=1;i<=10;i++){
  const img = new Image();
  img.src = `/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`] = img;
}

/* ================= ACTIVITIES ================= */
const ACTIVITIES = {
  move2: [
    { text:"➡️ Πήγαινε 2 μπροστά", move:2 },
    { text:"⬅️ Πήγαινε 2 πίσω", move:-2 }
  ],
  move3: [
    { text:"➡️ Πήγαινε 3 μπροστά", move:3 },
    { text:"⬅️ Πήγαινε 3 πίσω", move:-3 }
  ],
  swap: [
    { text:"🔄 Αντάλλαξε θέση με άλλον παίκτη", swap:true }
  ]
};

function generateActivities(){
  activityCells = {};
  while(Object.keys(activityCells).length < 25){
    const n = Math.floor(Math.random()*98)+2;
    const keys = Object.keys(ACTIVITIES);
    activityCells[n] = keys[Math.floor(Math.random()*keys.length)];
  }
}

/* ================= WS ================= */
const ws = new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

ws.onmessage = e => {
  const { type, data } = JSON.parse(e.data);
  if(type==="INIT" || type==="UPDATE"){
    players = data.players;
    syncVisuals();
  }
};

/* ================= SYNC ================= */
function syncVisuals(){
  Object.values(players).forEach(p=>{
    if(p.pos === 0) return;
    if(!visualPlayers[p.pawn]){
      visualPlayers[p.pawn] = { pos:p.pos };
    }
    visualPlayers[p.pawn].pos = p.pos;
    checkActivity(p.pawn);
  });
  draw();
}

/* ================= ACTIVITY ================= */
function checkActivity(pawn){
  const p = visualPlayers[pawn];
  const type = activityCells[p.pos];
  if(!type) return;

  const action = ACTIVITIES[type][
    Math.floor(Math.random()*ACTIVITIES[type].length)
  ];

  showCommand(action.text);

  if(action.move){
    p.pos = Math.max(1, Math.min(100, p.pos + action.move));
  }

  if(action.swap){
    const others = Object.values(visualPlayers).filter(v => v !== p);
    if(others.length > 0){
      const target = others[Math.floor(Math.random()*others.length)];
      const temp = p.pos;
      p.pos = target.pos;
      target.pos = temp;
    }
  }
}

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const x=c*CELL,y=(9-r)*CELL;

    ctx.fillStyle=(n%2===1)?COLOR_A:COLOR_B;
    ctx.fillRect(x,y,CELL,CELL);

    ctx.strokeStyle="#ffffff44";
    ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);
  }

  Object.entries(visualPlayers).forEach(([pawn,p])=>{
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const cx=c*CELL+CELL/2;
    const cy=(9-r)*CELL+CELL/2;

    const img=images[pawn];
    if(img && img.complete){
      const size=CELL*0.65;
      ctx.drawImage(img,cx-size/2,cy-size/2,size,size);
    }
  });
}

/* ================= COMMAND ================= */
const overlay=document.getElementById("commandOverlay");
const box=document.getElementById("commandBox");

function showCommand(text){
  box.textContent=text;
  overlay.style.opacity=1;
  setTimeout(()=>overlay.style.opacity=0,2500);
}

/* ================= UI ================= */
document.getElementById("startBtn").onclick=()=>{
  generateActivities();
  ws.send(JSON.stringify({type:"START"}));
};

document.getElementById("resetBtn").onclick=()=>{
  visualPlayers={};
  players={};
  generateActivities();
  ws.send(JSON.stringify({type:"RESET"}));
  draw();
};

document.getElementById("qrImg").src=
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+
  encodeURIComponent(location.origin+"/phone");

/* ================= INIT ================= */
generateActivities();
draw();
</script>

</body>
</html>
