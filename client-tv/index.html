<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}

#layout{
  display:grid;
  grid-template-columns:auto auto;
  gap:24px;
  align-items:start;
}

canvas{
  background:#2F6364;
}

/* SIDE UI */
#sideUI{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}

button{
  width:160px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}

#qr{
  background:white;
  padding:12px;
  border-radius:14px;
}

/* CENTER MESSAGE */
#message{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
}

#messageBox{
  background:#FFD166;
  color:#000;
  padding:40px 60px;
  font-size:34px;
  font-weight:bold;
  border-radius:40px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}
</style>
</head>

<body>

<div id="layout">
  <canvas id="board" width="800" height="800"></canvas>

  <div id="sideUI">
    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>

    <div id="qr">
      <img id="qrImg" width="160">
    </div>
  </div>
</div>

<div id="message">
  <div id="messageBox"></div>
</div>

<script>
/* ================= CANVAS ================= */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const SIZE = 10;
const CELL = canvas.width / SIZE;

/* ================= ACTIVITIES ================= */
const ACTIVITIES = {
  star: {
    color:"#FFD166",
    symbol:"⭐",
    actions:[
      { text:"Πήγαινε 2 μπροστά", move: 2 },
      { text:"Πήγαινε 3 μπροστά", move: 3 }
    ]
  },
  circle: {
    color:"#06D6A0",
    symbol:"●",
    actions:[
      { text:"Πήγαινε 2 πίσω", move: -2 },
      { text:"Πήγαινε 3 πίσω", move: -3 }
    ]
  },
  square: {
    color:"#EF476F",
    symbol:"■",
    actions:[
      { text:"Αντάλλαξε θέση με τον 3ο παίκτη", swap: 2 }
    ]
  }
};

/* ===== RANDOM ACTIVITY CELLS ===== */
const activityCells = {};
while(Object.keys(activityCells).length < 25){
  const n = Math.floor(Math.random()*98)+2;
  const keys = Object.keys(ACTIVITIES);
  activityCells[n] = keys[Math.floor(Math.random()*keys.length)];
}

/* ================= STATE ================= */
let players = {};
let lastPos = {};

/* ================= WEBSOCKET ================= */
const ws = new WebSocket(
 (location.protocol==="https:"?"wss://":"ws://")+location.host
);

ws.onmessage = e => {
  const { type, data } = JSON.parse(e.data);

  if(type === "INIT" || type === "UPDATE"){
    players = data.players;
    applyActivities();
    draw();
  }
};

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    const num=i+1;
    const row=Math.floor(i/10);
    const col=row%2===0?i%10:9-(i%10);
    const x=col*CELL;
    const y=(9-row)*CELL;

    ctx.fillStyle = activityCells[num]
      ? ACTIVITIES[activityCells[num]].color
      : "#2F6364";
    ctx.fillRect(x,y,CELL,CELL);

    ctx.strokeStyle="#ffffff55";
    ctx.strokeRect(x,y,CELL,CELL);

    ctx.fillStyle="#000";
    ctx.font="bold 16px Arial";
    ctx.textAlign="left";
    ctx.textBaseline="top";
    ctx.fillText(num,x+6,y+4);

    if(activityCells[num]){
      ctx.font="28px Arial";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(
        ACTIVITIES[activityCells[num]].symbol,
        x+CELL/2,
        y+CELL/2
      );
    }
  }

  Object.values(players).forEach(p=>{
    const pos=p.pos||1;
    const i=pos-1;
    const row=Math.floor(i/10);
    const col=row%2===0?i%10:9-(i%10);
    const cx=col*CELL+CELL/2;
    const cy=(9-row)*CELL+CELL/2;

    ctx.beginPath();
    ctx.fillStyle="#FFD166";
    ctx.arc(cx,cy,CELL*0.28,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#000";
    ctx.font="bold 18px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("A"+p.pawn.split("_")[1],cx,cy);
  });
}

/* ================= ACTIVITY LOGIC ================= */
function applyActivities(){
  const list = Object.values(players);

  list.forEach((p, index)=>{
    if(p.pos && lastPos[p.pawn] !== p.pos){
      lastPos[p.pawn] = p.pos;

      const type = activityCells[p.pos];
      if(!type) return;

      const act = ACTIVITIES[type];
      const action = act.actions[
        Math.floor(Math.random()*act.actions.length)
      ];

      // MOVE
      if(action.move){
        p.pos += action.move;
        if(p.pos < 1) p.pos = 1;
        if(p.pos > 100) p.pos = 100;
        showMessage(action.text);
      }

      // SWAP
      if(action.swap !== undefined){
        const target = list[action.swap];
        if(target){
          const tmp = p.pos;
          p.pos = target.pos;
          target.pos = tmp;
          showMessage(action.text);
        }
      }
    }
  });
}

/* ================= MESSAGE ================= */
const message=document.getElementById("message");
const messageBox=document.getElementById("messageBox");

function showMessage(text){
  messageBox.textContent=text;
  message.style.opacity=1;
  setTimeout(()=>message.style.opacity=0,2500);
}

/* ================= UI ================= */
document.getElementById("startBtn").onclick=()=>{
  ws.send(JSON.stringify({ type:"START" }));
};

document.getElementById("resetBtn").onclick=()=>{
  ws.send(JSON.stringify({ type:"RESET" }));
};

document.getElementById("qrImg").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
  encodeURIComponent(location.origin + "/phone");

draw();
</script>

</body>
</html>
