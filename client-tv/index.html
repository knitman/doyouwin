<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Board – TV</title>

<style>
body{
  margin:0;
  background:#1b1b1b;
  color:#fff;
  font-family:Arial, sans-serif;
}
#root{
  display:grid;
  grid-template-columns:240px auto 280px;
  height:100vh;
  gap:24px;
  padding:24px;
}
#controls{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
}
button,select{
  width:190px;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:16px;
}
button{
  background:#FFD166;
  font-weight:bold;
  cursor:pointer;
}
canvas{
  background:#2F6364;
  border-radius:16px;
}
#scores{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.score{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#333;
  padding:10px 14px;
  border-radius:14px;
}
.score.leader{
  background:#FFD166;
  color:#000;
  font-weight:bold;
}
.score img{
  width:42px;
  height:42px;
  object-fit:contain;
}
.points{
  font-size:22px;
  font-weight:bold;
}

/* NEW: PARTICIPANTS */
#participants{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
}
.participant{
  width:60px;
  height:60px;
  background:#333;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.participant img{
  width:85%;
  height:85%;
  object-fit:contain;
}

/* OVERLAY */
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:48px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:10;
}
#overlay.show{ opacity:1; }
#overlay img{
  width:120px;
  height:120px;
  object-fit:contain;
  margin-bottom:20px;
}
</style>
</head>

<body>

<div id="root">

  <div id="controls">
    <select id="targetSelect">
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="150">150</option>
      <option value="200">200</option>
    </select>

    <button id="startBtn">START</button>
    <button id="resetBtn">RESTART</button>

    <img id="qrImg" width="160">
  </div>

  <canvas id="board" width="800" height="800"></canvas>

  <div>
    <h2 style="text-align:center">🏆 Πόντοι</h2>
    <div id="scores"></div>

    <h2 style="text-align:center;margin-top:24px;">🎮 Παίκτες</h2>
    <div id="participants"></div>
  </div>

</div>

<div id="overlay"></div>

<!-- SOUNDS -->
<audio id="stepSound" src="/assets/sounds/step.mp3"></audio>
<audio id="jackpotSound" src="/assets/sounds/jackpot.mp3"></audio>
<audio id="leaderSound" src="/assets/sounds/leader.mp3"></audio>
<audio id="bgMusic" src="/assets/sounds/bg.mp3" loop></audio>

<script>
const STEP_DURATION = 1000;
const DICE_DISPLAY_MS = 2500;

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const CELL = canvas.width / 10;
const COLOR_A = "#3A7F80";
const COLOR_B = "#2F6364";

const stepSound = document.getElementById("stepSound");
const jackpotSound = document.getElementById("jackpotSound");
const leaderSound = document.getElementById("leaderSound");
const bgMusic = document.getElementById("bgMusic");
bgMusic.volume = 0.25;

let players = {};
let scores = {};
let visuals = {};
let images = {};
let winPoints = 50;
let lastLeader = null;

const participantsDiv = document.getElementById("participants");

function drawParticipants(){
  participantsDiv.innerHTML="";
  Object.keys(players).forEach(id=>{
    const p = players[id];
    if(!p) return;

    const d=document.createElement("div");
    d.className="participant";

    const img=document.createElement("img");
    img.src=images[p.pawn].src;

    d.appendChild(img);
    participantsDiv.appendChild(d);
  });
}

/* AVATARS */
for(let i=1;i<=10;i++){
  const img = new Image();
  img.src = `/assets/pawns/avatar_${i}.png`;
  images[`avatar_${i}`] = img;
}

/* DRAW */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<100;i++){
    const n=i+1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const x=c*CELL,y=(9-r)*CELL;
    ctx.fillStyle=n%2?COLOR_A:COLOR_B;
    ctx.fillRect(x,y,CELL,CELL);
    ctx.strokeStyle="#ffffff44";
    ctx.strokeRect(x,y,CELL,CELL);
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.font="bold 18px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n,x+CELL/2,y+CELL/2);
  }

  Object.values(visuals).forEach(p=>{
    if(p.pos<=0) return;
    const i=p.pos-1;
    const r=Math.floor(i/10);
    const c=r%2===0?i%10:9-(i%10);
    const cx=c*CELL+CELL/2;
    const cy=(9-r)*CELL+CELL/2;
    const img=images[p.pawn];
    if(img?.complete){
      const s=CELL*0.65;
      ctx.drawImage(img,cx-s/2,cy-s/2,s,s);
    }
  });
}

/* ... ΟΛΟ ΤΟ ΥΠΟΛΟΙΠΟ SCRIPT ΣΟΥ ΜΕΝΕΙ ΙΔΙΟ ... */

</script>

</body>
</html>
