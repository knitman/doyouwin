<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Player</title>
<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,60px);
  gap:14px;
}
.emoji{
  font-size:40px;
  background:#222;
  padding:10px;
  border-radius:14px;
}
.emoji.selected{background:#ff006e;}
button{
  margin-top:30px;
  padding:14px 30px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#ffbe0b;
  font-weight:bold;
}
</style>
</head>
<body>

<h2 id="title">Διάλεξε πιόνι</h2>
<div class="grid" id="grid"></div>
<button id="action">ΕΤΟΙΜΟΣ</button>

<script>
const ws=new WebSocket("ws://localhost:8080");
const emojis=["😎","🤡","🤖","👑","🐱","🐶","🦊","🐸","👻","💀"];
let selected=null;
let myId=null;
let currentTurn=null;
const grid=document.getElementById("grid");
const btn=document.getElementById("action");
const title=document.getElementById("title");

ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="INIT") render(data.players);
  if(type==="UPDATE"){
    currentTurn=data.turn;
    render(data.players);
    updateUI();
  }
};

function render(players){
  grid.innerHTML="";
  emojis.forEach(e=>{
    const used=Object.values(players).some(p=>p.emoji===e);
    const d=document.createElement("div");
    d.className="emoji"+(selected===e?" selected":"");
    d.textContent=e;
    if(!used) d.onclick=()=>{selected=e; render(players);}
    else d.style.opacity=0.3;
    grid.appendChild(d);
  });
}

btn.onclick=()=>{
  if(!myId && selected){
    ws.send(JSON.stringify({type:"JOIN",data:{emoji:selected}}));
    myId=ws;
    title.textContent="Περιμένε τη σειρά σου";
    btn.textContent="ROLL 🎲";
  }else{
    ws.send(JSON.stringify({type:"ROLL"}));
  }
};

function updateUI(){
  if(currentTurn && ws.id===currentTurn){
    btn.disabled=false;
    title.textContent="Η ΣΕΙΡΑ ΣΟΥ!";
  }else{
    btn.disabled=true;
  }
}
</script>

</body>
</html>
