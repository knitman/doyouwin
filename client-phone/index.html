<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Player</title>

<style>
body{
  margin:0;
  background:#2F6364; /* ✅ νέο background */
  color:white;
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* TITLE */
h2{
  margin-bottom:28px;
  font-size:40px;
  font-weight:bold;
}

/* EMOJI GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,160px);
  gap:28px;
}

.emoji{
  font-size:128px;
  background:#222;
  padding:20px;
  border-radius:32px;
  line-height:1;
  cursor:pointer;
  transition:transform .15s, background .15s;
}

.emoji:active{
  transform:scale(0.92);
}

.emoji.selected{
  background:#ff006e;
}

/* DICE RESULT */
#diceResult{
  margin-top:30px;
  font-size:48px;
  font-weight:bold;
  min-height:60px;
}

/* BUTTON */
button{
  margin-top:36px;
  padding:26px 56px;
  font-size:32px;
  border:none;
  border-radius:26px;
  background:#ffbe0b;
  font-weight:bold;
}

button:disabled{
  opacity:0.4;
}
</style>
</head>

<body>

<h2 id="title">Διάλεξε πιόνι</h2>

<div class="grid" id="grid"></div>

<div id="diceResult"></div>

<button id="action">ΕΤΟΙΜΟΣ</button>

<script>
/* ===== WebSocket ===== */
const ws = new WebSocket(
  (location.protocol === "https:" ? "wss://" : "ws://") + location.host
);

/* ===== DOM ===== */
const grid = document.getElementById("grid");
const btn = document.getElementById("action");
const title = document.getElementById("title");
const diceResult = document.getElementById("diceResult");

/* ===== State ===== */
let emojis = [];
let players = {};
let selected = null;
let myTurn = false;
let gameState = "WAITING";

/* ===== WebSocket events ===== */
ws.onmessage = e => {
  const { type, data } = JSON.parse(e.data);

  if(type === "INIT"){
    emojis = data.emojis;
    players = data.players;
    gameState = data.gameState;
    render();
  }

  if(type === "UPDATE"){
    players = data.players;
    gameState = data.gameState;
    myTurn = data.turn && players[data.turn]?.emoji === selected;
    updateUI();
  }

  if(type === "DICE"){
    if(players[data.id]?.emoji === selected){
      diceResult.textContent = "🎲 Έφερες: " + data.dice;
    }
  }

  if(type === "WIN"){
    title.textContent = "🏆 Νικητής " + data.emoji;
    btn.disabled = true;
  }
};

/* ===== Render emojis ===== */
function render(){
  grid.innerHTML = "";
  emojis.forEach(e=>{
    const used = Object.values(players).some(p => p.emoji === e);

    const d = document.createElement("div");
    d.className = "emoji" + (selected === e ? " selected" : "");
    d.textContent = e;

    if(!used){
      d.onclick = ()=>{
        selected = e;
        render();
      };
    }else{
      d.style.opacity = 0.3;
      d.style.pointerEvents = "none";
    }

    grid.appendChild(d);
  });
}

/* ===== UI state ===== */
function updateUI(){
  if(gameState !== "PLAYING"){
    title.textContent = "Περίμενε να ξεκινήσει";
    btn.disabled = true;
    return;
  }

  if(myTurn){
    title.textContent = "🎯 Η ΣΕΙΡΑ ΣΟΥ";
    btn.textContent = "ROLL 🎲";
    btn.disabled = false;
  }else{
    title.textContent = "⏳ ΠΕΡΙΜΕΝΕ";
    btn.disabled = true;
  }
}

/* ===== Button ===== */
btn.onclick = ()=>{
  if(gameState === "WAITING" && selected){
    ws.send(JSON.stringify({
      type:"JOIN",
      data:{ emoji:selected }
    }));
    btn.disabled = true;
  }
  else if(myTurn){
    diceResult.textContent = "";
    ws.send(JSON.stringify({ type:"ROLL" }));
  }
};
</script>

</body>
</html>
