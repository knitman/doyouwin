<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Pick Emoji</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,60px);
  gap:14px;
}
.emoji{
  font-size:40px;
  padding:10px;
  background:#222;
  border-radius:14px;
  cursor:pointer;
}
.emoji.selected{
  background:#ff006e;
}
button{
  margin-top:30px;
  padding:14px 30px;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#ffbe0b;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>Διάλεξε πιόνι</h2>
<div class="grid" id="grid"></div>
<button id="ready">ΕΙΜΑΙ ΕΤΟΙΜΟΣ</button>

<script>
const ws = new WebSocket("ws://localhost:8080");
const grid = document.getElementById("grid");
let selected = null;
let emojis = [];

ws.onmessage = e=>{
  const { type, data } = JSON.parse(e.data);
  if(type==="INIT"){
    emojis = data.emojis;
    render(data.players);
  }
  if(type==="UPDATE"){
    render(data);
  }
};

function render(players){
  grid.innerHTML="";
  emojis.forEach(e=>{
    const used = Object.values(players).some(p=>p.emoji===e);
    const div=document.createElement("div");
    div.className="emoji"+(selected===e?" selected":"");
    div.textContent=e;
    if(used) div.style.opacity=0.3;
    else div.onclick=()=>{selected=e; render(players);}
    grid.appendChild(div);
  });
}

document.getElementById("ready").onclick=()=>{
  if(!selected) return;
  ws.send(JSON.stringify({ type:"JOIN", data:{ emoji:selected } }));
};
</script>

</body>
</html>
