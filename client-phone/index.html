<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Board – Κινητό</title>

<style>
body{
  margin:0;
  height:100vh;
  background:#2F6364;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}

#app{
  width:100%;
  max-width:420px;
  padding:24px;
  text-align:center;
  color:white;
}

/* AVATARS */
#avatars{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:24px;
}

.avatar{
  background:white;
  border-radius:16px;
  padding:8px;
  cursor:pointer;
  border:4px solid transparent;
}

.avatar img{
  width:100%;
  height:60px;
  object-fit:contain;
}

.avatar.selected{
  border-color:#FFD166;
}

/* BUTTONS */
button{
  width:100%;
  border:none;
  border-radius:24px;
  font-weight:bold;
  cursor:pointer;
}

/* READY */
#readyBtn{
  padding:18px;
  font-size:22px;
  background:#FFD166;
  color:black;
  margin-bottom:24px;
}

/* BIG DICE */
#diceBtn{
  display:none;
  height:140px;
  font-size:40px;
  background:#EF476F;
  color:white;
  box-shadow:0 10px 20px rgba(0,0,0,.3);
}

/* INFO */
#info{
  margin-top:16px;
  font-size:18px;
  opacity:.9;
}
</style>
</head>

<body>

<div id="app">

  <!-- AVATAR PICK -->
  <div id="avatars"></div>

  <!-- READY -->
  <button id="readyBtn" disabled>ΕΙΜΑΙ ΕΤΟΙΜΟΣ</button>

  <!-- BIG DICE -->
  <button id="diceBtn">🎲 ΡΙΞΕ ΖΑΡΙ</button>

  <div id="info"></div>

</div>

<script>
const ws = new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

let myPawn=null;
let myId=null;
let myTurn=false;

/* ===== AVATARS ===== */
const avatars=document.getElementById("avatars");
for(let i=1;i<=10;i++){
  const d=document.createElement("div");
  d.className="avatar";
  d.innerHTML=`<img src="/assets/pawns/avatar_${i}.png">`;
  d.onclick=()=>{
    document.querySelectorAll(".avatar").forEach(a=>a.classList.remove("selected"));
    d.classList.add("selected");
    myPawn=`avatar_${i}`;
    readyBtn.disabled=false;
  };
  avatars.appendChild(d);
}

/* ===== READY ===== */
const readyBtn=document.getElementById("readyBtn");
readyBtn.onclick=()=>{
  ws.send(JSON.stringify({type:"JOIN",data:{pawn:myPawn}}));
  readyBtn.style.display="none";
  avatars.style.display="none";
  document.getElementById("info").textContent="Περίμενε τη σειρά σου…";
};

/* ===== DICE ===== */
const diceBtn=document.getElementById("diceBtn");
diceBtn.onclick=()=>{
  if(!myTurn) return;
  ws.send(JSON.stringify({type:"ROLL"}));
  myTurn=false;
  diceBtn.style.display="none";
  document.getElementById("info").textContent="Περιμένεις τους άλλους…";
};

/* ===== WS ===== */
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="INIT"){
    myId=data.id;
  }

  if(type==="UPDATE"){
    if(data.turn===myId){
      myTurn=true;
      diceBtn.style.display="block";
      document.getElementById("info").textContent="🎯 Η σειρά σου!";
    }
  }
};
</script>

</body>
</html>
