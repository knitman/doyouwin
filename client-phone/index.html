<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Player</title>
<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,64px);
  gap:16px;
}
.emoji{
  font-size:42px;
  background:#222;
  padding:12px;
  border-radius:16px;
}
.emoji.selected{background:#ff006e;}
button{
  margin-top:32px;
  padding:16px 36px;
  font-size:22px;
  border:none;
  border-radius:16px;
  background:#ffbe0b;
  font-weight:bold;
}
button:disabled{opacity:0.4;}
</style>
</head>
<body>

<h2 id="title">Διάλεξε πιόνι</h2>
<div class="grid" id="grid"></div>
<button id="action">ΕΤΟΙΜΟΣ</button>

<script>
const ws = new WebSocket("ws://localhost:8080");
const grid = document.getElementById("grid");
const btn = document.getElementById("action");
const title = document.getElementById("title");

let emojis=[];
let players={};
let selected=null;
let myTurn=false;
let gameState="WAITING";

ws.onmessage = e=>{
  const { type, data } = JSON.parse(e.data);

  if(type==="INIT"){
    emojis=data.emojis;
    players=data.players;
    gameState=data.gameState;
    render();
  }

  if(type==="UPDATE"){
    players=data.players;
    gameState=data.gameState;
    myTurn = data.turn && players[data.turn]?.emoji === selected;
    render();
    updateUI();
  }

  if(type==="WIN"){
    title.textContent="🏆 Νικητής " + data.emoji;
    btn.disabled=true;
  }
};

function render(){
  grid.innerHTML="";
  emojis.forEach(e=>{
    const used = Object.values(players).some(p=>p.emoji===e);
    const d=document.createElement("div");
    d.className="emoji"+(selected===e?" selected":"");
    d.textContent=e;
    if(!used){
      d.onclick=()=>{selected=e; render();}
    }else{
      d.style.opacity=0.3;
    }
    grid.appendChild(d);
  });
}

function updateUI(){
  if(gameState!=="PLAYING"){
    title.textContent="Περίμενε να ξεκινήσει";
    btn.disabled=true;
    return;
  }
  if(myTurn){
    title.textContent="🎯 Η ΣΕΙΡΑ ΣΟΥ";
    btn.textContent="ROLL 🎲";
    btn.disabled=false;
    navigator.vibrate?.(200);
  }else{
    title.textContent="⏳ ΠΕΡΙΜΕΝΕ";
    btn.disabled=true;
  }
}

btn.onclick=()=>{
  if(gameState==="WAITING" && selected){
    ws.send(JSON.stringify({ type:"JOIN", data:{ emoji:selected }}));
    btn.disabled=true;
  }else if(myTurn){
    ws.send(JSON.stringify({ type:"ROLL" }));
  }
};
</script>

</body>
</html>
