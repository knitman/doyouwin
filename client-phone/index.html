<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Board – Phone</title>

<style>
body{
  margin:0;
  background:#2F6364;
  color:#fff;
  font-family:Arial,sans-serif;
}

#avatars{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  padding:20px;
}

.avatar{
  position:relative;
  border:2px solid transparent;
  border-radius:10px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  display:block;
  border-radius:10px;
}

.avatar.sel{
  border:3px solid #FFD700;
}

/* 🔒 LOCK */
.avatar.locked::after{
  content:"🔒";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

button{
  width:90%;
  margin:20px;
  padding:15px;
  font-size:18px;
}
</style>
</head>

<body>

<div id="avatars"></div>
<button id="ready" disabled>READY</button>
<div id="info"></div>

<script>
const ws = new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

let myId=null, myPawn=null;

const avatars=document.getElementById("avatars");
const ready=document.getElementById("ready");
const info=document.getElementById("info");

/* AVATARS */
for(let i=1;i<=10;i++){
  const d=document.createElement("div");
  d.className="avatar";
  d.dataset.pawn=`avatar_${i}`;
  d.innerHTML=`<img src="/assets/pawns/avatar_${i}.png">`;

  d.onclick=()=>{
    if(d.classList.contains("locked")) return;

    document.querySelectorAll(".avatar").forEach(a=>a.classList.remove("sel"));
    d.classList.add("sel");
    myPawn=d.dataset.pawn;
    ready.disabled=false;
  };

  avatars.appendChild(d);
}

/* READY */
ready.onclick=()=>{
  ws.send(JSON.stringify({type:"JOIN",data:{pawn:myPawn}}));
};

/* WS */
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="INIT") myId=data.id;

  if(type==="PAWN_STATE"){
    document.querySelectorAll(".avatar").forEach(a=>{
      if(data.includes(a.dataset.pawn)){
        a.classList.add("locked");
      }else{
        a.classList.remove("locked");
      }
    });
  }

  if(type==="PAWN_TAKEN"){
    info.textContent="❌ Το πιόνι το πήρε άλλος!";
  }
};
</script>

</body>
</html>
