<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Party Player</title>

<style>
body{
  margin:0;
  background:#2F6364;
  color:white;
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* TITLE */
h2{
  margin-bottom:28px;
  font-size:40px;
  font-weight:bold;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,180px);
  gap:30px;
}

/* PAWN CARD */
.pawn{
  background:#1f4041;
  border-radius:32px;
  padding:18px;
  cursor:pointer;
  transition:transform .15s, background .15s;
}

.pawn:active{
  transform:scale(0.95);
}

.pawn.selected{
  background:#ff006e;
}

.pawn.disabled{
  opacity:0.3;
  pointer-events:none;
}

/* IMAGE */
.pawn img{
  width:140px;
  height:140px;
  object-fit:contain;
}

/* DICE */
#diceResult{
  margin-top:30px;
  font-size:48px;
  font-weight:bold;
  min-height:60px;
}

/* BUTTON */
button{
  margin-top:36px;
  padding:26px 56px;
  font-size:32px;
  border:none;
  border-radius:26px;
  background:#ffbe0b;
  font-weight:bold;
}

button:disabled{
  opacity:0.4;
}
</style>
</head>

<body>

<h2 id="title">Διάλεξε πιόνι</h2>

<div class="grid" id="grid"></div>

<div id="diceResult"></div>

<button id="action">ΕΤΟΙΜΟΣ</button>

<script>
/* ================= PAWNS (avatar_1 έως avatar_10) ================= */
const PAWNS = [
  { id:"avatar_1", img:"/client-phone/assets/pawns/avatar_1.png" },
  { id:"avatar_2", img:"/client-phone/assets/pawns/avatar_2.png" },
  { id:"avatar_3", img:"/client-phone/assets/pawns/avatar_3.png" },
  { id:"avatar_4", img:"/client-phone/assets/pawns/avatar_4.png" },
  { id:"avatar_5", img:"/client-phone/assets/pawns/avatar_5.png" },
  { id:"avatar_6", img:"/client-phone/assets/pawns/avatar_6.png" },
  { id:"avatar_7", img:"/client-phone/assets/pawns/avatar_7.png" },
  { id:"avatar_8", img:"/client-phone/assets/pawns/avatar_8.png" },
  { id:"avatar_9", img:"/client-phone/assets/pawns/avatar_9.png" },
  { id:"avatar_10", img:"/client-phone/assets/pawns/avatar_10.png" }
];

/* ================= WEBSOCKET ================= */
const ws = new WebSocket(
  (location.protocol === "https:" ? "wss://" : "ws://") + location.host
);

/* ================= DOM ================= */
const grid = document.getElementById("grid");
const btn = document.getElementById("action");
const title = document.getElementById("title");
const diceResult = document.getElementById("diceResult");

/* ================= STATE ================= */
let players = {};
let selectedPawn = null;
let myTurn = false;
let gameState = "WAITING";

/* ================= SOCKET EVENTS ================= */
ws.onmessage = e => {
  const { type, data } = JSON.parse(e.data);

  if(type === "INIT"){
    players = data.players;
    render();
  }

  if(type === "UPDATE"){
    players = data.players;
    gameState = data.gameState;
    myTurn = data.turn && players[data.turn]?.pawn === selectedPawn;
    updateUI();
  }

  if(type === "DICE"){
    if(players[data.id]?.pawn === selectedPawn){
      diceResult.textContent = "🎲 Έφερες: " + data.dice;
    }
  }

  if(type === "WIN"){
    title.textContent = "🏆 Νικητής";
    btn.disabled = true;
  }
};

/* ================= RENDER ================= */
function render(){
  grid.innerHTML = "";

  PAWNS.forEach(p=>{
    const used = Object.values(players).some(pl => pl.pawn === p.id);

    const card = document.createElement("div");
    card.className =
      "pawn" +
      (selectedPawn === p.id ? " selected" : "") +
      (used ? " disabled" : "");

    const img = document.createElement("img");
    img.src = p.img;

    if(!used){
      card.onclick = ()=>{
        selectedPawn = p.id;
        render();
      };
    }

    card.appendChild(img);
    grid.appendChild(card);
  });
}

/* ================= UI ================= */
function updateUI(){
  if(gameState !== "PLAYING"){
    title.textContent = "Περίμενε να ξεκινήσει";
    btn.disabled = true;
    return;
  }

  if(myTurn){
    title.textContent = "🎯 Η ΣΕΙΡΑ ΣΟΥ";
    btn.textContent = "ROLL 🎲";
    btn.disabled = false;
  }else{
    title.textContent = "⏳ ΠΕΡΙΜΕΝΕ";
    btn.disabled = true;
  }
}

/* ================= BUTTON ================= */
btn.onclick = ()=>{
  if(gameState === "WAITING" && selectedPawn){
    ws.send(JSON.stringify({
      type:"JOIN",
      data:{ pawn:selectedPawn }
    }));
    btn.disabled = true;
  }
  else if(myTurn){
    diceResult.textContent = "";
    ws.send(JSON.stringify({ type:"ROLL" }));
  }
};
</script>

</body>
</html>
