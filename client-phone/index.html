<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Board – Phone</title>

<style>
body{
  margin:0;
  background:#2F6364;
  color:#fff;
  font-family:Arial,sans-serif;
}
#app{
  max-width:420px;
  margin:auto;
  padding:20px;
  text-align:center;
}
#avatars{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}
.avatar{
  background:#fff;
  border-radius:14px;
  padding:6px;
  cursor:pointer;
}
.avatar img{ width:100%; height:60px; object-fit:contain; }
.avatar.sel{ outline:4px solid #FFD166; }

button{
  width:100%;
  padding:18px;
  margin-top:18px;
  font-size:26px;
  border:none;
  border-radius:22px;
  background:#FFD166;
  font-weight:bold;
}
#dice{ display:none; background:#EF476F; color:#fff; }
#info{ margin-top:14px; font-size:18px; }
</style>
</head>

<body>

<div id="app">
  <h2>Διάλεξε πιόνι</h2>
  <div id="avatars"></div>

  <button id="ready" disabled>ΕΤΟΙΜΟΣ</button>
  <button id="dice">🎲 ΡΙΞΕ ΖΑΡΙ</button>

  <div id="info"></div>
</div>

<script>
const ws=new WebSocket(
 (location.protocol==="https:"?"wss://":"ws://")+location.host
);

let myId=null,myPawn=null,myTurn=false,myScore=0;

/* AVATARS */
avatars.innerHTML="";
for(let i=1;i<=10;i++){
  const d=document.createElement("div");
  d.className="avatar";
  d.innerHTML=`<img src="/assets/pawns/avatar_${i}.png">`;
  d.onclick=()=>{
    document.querySelectorAll(".avatar").forEach(a=>a.classList.remove("sel"));
    d.classList.add("sel");
    myPawn=`avatar_${i}`;
    ready.disabled=false;
  };
  avatars.appendChild(d);
}

/* READY */
ready.onclick=()=>{
  ws.send(JSON.stringify({type:"JOIN",data:{pawn:myPawn}}));
  ready.style.display="none";
  avatars.style.display="none";
  info.textContent="Περιμένεις…";
};

/* DICE */
dice.onclick=()=>{
  if(!myTurn) return;
  ws.send(JSON.stringify({type:"ROLL"}));
  myTurn=false;
  dice.style.display="none";
  info.textContent="Περιμένεις…";
};

/* WS */
ws.onmessage=e=>{
  const {type,data}=JSON.parse(e.data);

  if(type==="INIT") myId=data.id;

  if(type==="UPDATE"){
    myScore=data.scores?.[myId]??myScore;
    if(data.turn===myId){
      myTurn=true;
      dice.style.display="block";
      info.textContent=`Η σειρά σου • Πόντοι: ${myScore}`;
    }
  }

  if(type==="BONUS" && data.id===myId){
    navigator.vibrate?.(data.bonus>=8?[300,100,300]:[200]);
    info.textContent=
      data.bonus>=8 ? `🎉 JACKPOT +${data.bonus}` :
      data.bonus>0 ? `➕ +${data.bonus} πόντοι` :
                     `❌ ${data.bonus} πόντοι`;
  }

  if(type==="TOURNAMENT_WINNER"){
    info.textContent =
      data.id===myId ? "🏆 ΚΕΡΔΙΣΕΣ ΤΟ ΤΟΥΡΝΟΥΑ!" : "😅 Τέλος τουρνουά";
  }
};
</script>

</body>
</html>
