<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Party Board – Phone</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#2F6364;
  color:#fff;
  text-align:center;
}
h1{ margin:16px 0; }

#pawns{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:12px;
  padding:16px;
}

.pawn{
  background:#ffffff22;
  border-radius:16px;
  padding:10px;
  cursor:pointer;
  border:3px solid transparent;
  transition:.2s;
}
.pawn img{
  width:64px;
  height:64px;
  object-fit:contain;
}
.pawn.selected{
  border-color:#FFD166;
  background:#ffffff55;
}
.pawn.taken{
  opacity:.25;
  filter:grayscale(1);
  pointer-events:none;
}

button{
  margin-top:18px;
  padding:14px 28px;
  font-size:22px;
  border:none;
  border-radius:14px;
  background:#FFD166;
  font-weight:bold;
}

#dice{
  margin-top:24px;
  display:none;
}

#msg{
  margin-top:16px;
  min-height:28px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>Διάλεξε Πιόνι</h1>

<div id="pawns"></div>

<button id="readyBtn">ΕΙΜΑΙ ΕΤΟΙΜΟΣ</button>

<div id="dice">
  <button id="rollBtn">ΡΙΞΕ ΖΑΡΙ</button>
</div>

<div id="msg"></div>

<script>
const ws = new WebSocket(
  (location.protocol==="https:"?"wss://":"ws://")+location.host
);

let selectedPawn = null;
let players = {};

const pawnsDiv = document.getElementById("pawns");
const msg = document.getElementById("msg");
const readyBtn = document.getElementById("readyBtn");
const diceDiv = document.getElementById("dice");
const rollBtn = document.getElementById("rollBtn");

/* CREATE PAWNS */
for(let i=1;i<=10;i++){
  const d = document.createElement("div");
  d.className = "pawn";
  d.dataset.pawn = `avatar_${i}`;
  d.innerHTML = `<img src="/assets/pawns/avatar_${i}.png">`;

  d.onclick = () => {
    if(d.classList.contains("taken")) return;

    document.querySelectorAll(".pawn")
      .forEach(p=>p.classList.remove("selected"));

    d.classList.add("selected");
    selectedPawn = d.dataset.pawn;
  };

  pawnsDiv.appendChild(d);
}

/* UPDATE TAKEN PAWNS */
function refreshTaken(){
  const taken = Object.values(players).map(p=>p.pawn);

  document.querySelectorAll(".pawn").forEach(p=>{
    const pawn = p.dataset.pawn;
    if(taken.includes(pawn)){
      p.classList.add("taken");
    }else{
      p.classList.remove("taken");
    }
  });
}

/* READY */
readyBtn.onclick = ()=>{
  if(!selectedPawn){
    msg.innerText = "Διάλεξε πρώτα πιόνι";
    return;
  }
  ws.send(JSON.stringify({
    type:"JOIN",
    data:{ pawn:selectedPawn }
  }));
};

/* ROLL */
rollBtn.onclick = ()=>{
  ws.send(JSON.stringify({ type:"ROLL" }));
};

/* WS */
ws.onmessage = e=>{
  const {type, data} = JSON.parse(e.data);

  if(type==="INIT" || type==="UPDATE"){
    players = data.players || {};
    refreshTaken();

    if(data.turn === ws.id){
      diceDiv.style.display="block";
      msg.innerText = "Η σειρά σου!";
    }else{
      diceDiv.style.display="none";
    }
  }

  if(type==="PAWN_TAKEN"){
    msg.innerText = "❌ Το πιόνι χρησιμοποιείται. Διάλεξε άλλο.";
  }

  if(type==="DICE"){
    msg.innerText = `Έφερες 🎲 ${data.dice}`;
  }
};
</script>

</body>
</html>
